        } else if (truncate) {
            files.set(found, new Uint8Array(0));
        }
        const fd = next_fd++;
        open_files.set(fd, {
            path: found,
            at: 0,
            append: (fdflags & 1) !== 0,
            dir: false,
        });
        mem_view().setUint32(fd_out, fd, true);
        return 0;
    }),
    path_create_directory: (dir_fd, path_ptr, path_size) => {
        made_dirs.add(wasi_path(dir_fd, path_ptr, path_size));
        return 0;
    },
    path_filestat_get: new WebAssembly.Suspending(async (dir_fd, flags,
        path_ptr, path_size, stat) =>
    {
        const path = wasi_path(dir_fd, path_ptr, path_size);
        await fetch_file(path);
        const found = wasi_find(path);
        const u8 = mem_u8();
        u8.fill(0, stat, stat + 64);
        if (found !== null) {
            u8[stat + 16] = 4;
            mem_view().setBigUint64(
                stat + 32, BigInt(files.get(found).length), true);
            return 0;
        }
        if (wasi_is_dir(path)) { u8[stat + 16] = 3; return 0; }
        return WASI_ERRNO_NOENT;
    }),
    fd_filestat_get: (fd, stat) => {
        const f = open_files.get(fd);
        const u8 = mem_u8();
        u8.fill(0, stat, stat + 64);
        if (fd <= 2) { u8[stat + 16] = 2; return 0; }
        if (f === undefined) { return WASI_ERRNO_BADF; }
        u8[stat + 16] = f.dir ? 3 : 4;
        if (!f.dir) {
            mem_view().setBigUint64(
                stat + 32, BigInt(files.get(f.path).length), true);
        }
        return 0;
    },
    fd_read: (fd, iovs, iovs_size, read_out) => {
        const f = open_files.get(fd);
        const view = mem_view();
        if (f === undefined || f.dir) {
            view.setUint32(read_out, 0, true);
            return fd === 0 ? 0 : WASI_ERRNO_BADF;
        }
        const data = files.get(f.path);
        let total = 0;
        const u8 = mem_u8();
        for (let i = 0; i < iovs_size; i++) {
            const ptr = view.getUint32(iovs + i * 8, true);
            const size = view.getUint32(iovs + i * 8 + 4, true);
            const n = Math.max(0, Math.min(size, data.length - f.at));
            u8.set(data.subarray(f.at, f.at + n), ptr);
            f.at += n;
            total += n;
            if (n < size) { break; }
        }
        view.setUint32(read_out, total, true);
        return 0;
    },
    fd_seek: (fd, offset, whence, out) => {
        const f = open_files.get(fd);
        if (f === undefined || f.dir) { return WASI_ERRNO_BADF; }
        const size = files.get(f.path).length;
        const base = whence === 0 ? 0 : whence === 1 ? f.at : size;
        const at = base + Number(offset);
        if (at < 0) { return WASI_ERRNO_INVAL; }
        f.at = at;
        mem_view().setBigUint64(out, BigInt(at), true);
        return 0;
    },
    fd_tell: (fd, out) => {
        const f = open_files.get(fd);
        if (f === undefined) { return WASI_ERRNO_BADF; }
        mem_view().setBigUint64(out, BigInt(f.at), true);
        return 0;
    },
    fd_sync: () => 0,
    fd_fdstat_set_flags: () => 0,
    path_unlink_file: (dir_fd, path_ptr, path_size) => {
        const found = wasi_find(wasi_path(dir_fd, path_ptr, path_size));
        if (found === null) { return WASI_ERRNO_NOENT; }
        files.delete(found);
        store_writable(found, null);
        return 0;
    },
    environ_sizes_get: (count, size) => {
        const view = mem_view();
        view.setUint32(count, env_bytes.length, true);
        view.setUint32(size,
            env_bytes.reduce((sum, e) => sum + e.length, 0), true);
        return 0;
    },
    environ_get: (environ, buf) => {
        const view = mem_view();
        const u8 = mem_u8();
        let at = buf;
        for (let e = 0; e < env_bytes.length; e++) {
            view.setUint32(environ + e * 4, at, true);
            u8.set(env_bytes[e], at);
            at += env_bytes[e].length;
        }
        return 0;
    },
    args_sizes_get: (count, size) => {
        const view = mem_view();
        view.setUint32(count, args.length, true);
        view.setUint32(size,
            args_bytes.reduce((sum, a) => sum + a.length, 0), true);
        return 0;
    },
    args_get: (argv, buf) => {
        const view = mem_view();
        const u8 = mem_u8();
        let at = buf;
        for (let a = 0; a < args.length; a++) {
            view.setUint32(argv + a * 4, at, true);
            u8.set(args_bytes[a], at);
            at += args_bytes[a].length;
        }
        return 0;
    },
    clock_time_get: (id, precision, time) => {
        const ns = id === 0 ?
            BigInt(Date.now()) * 1000000n :
            BigInt(Math.round(performance.now() * 1000000));
        mem_view().setBigUint64(time, ns, true);
        return 0;
    },
    random_get: (buf, size) => {
        const u8 = mem_u8();
        for (let at = 0; at < size; at += 65536) {
            const n = Math.min(65536, size - at);
            const random = new Uint8Array(n);
            crypto.getRandomValues(random);
            u8.set(random, buf + at);
        }
        return 0;
    },
    sched_yield: () => 0,
    proc_exit: (code) => { throw new T1Exit(code); },
};
const wasi_imports = new Proxy(wasi_known, {
    get: (known, name) => {
        if (name in known) { return known[name]; }
        return () => {
            write_text(2, "T1: WASI's " + String(name) +
                " isn't there\n");
            return WASI_ERRNO_NOSYS;
        };
    },
});

/*
START: the resources and writables, then the app
*/
writables_db = await open_writables();
await load_writables();

/*
The size app.wasm asks of the memory it imports (env.memory), in 64 KB
pages: from its import section, which JS has no other way to read
*/
function memory_limits(bytes) {
    let at = 8; // after the magic number and the version
    function leb() {
        let value = 0;
        let shift = 0;
        let byte;
        do {
            byte = bytes[at++];
            value += (byte & 0x7F) * Math.pow(2, shift);
            shift += 7;
        } while (byte & 0x80);
        return value;
    }
    function name() {
        const size = leb();
        const text = utf8_decoder.decode(bytes.subarray(at, at + size));
        at += size;
        return text;
    }
    function limits() {
        const flags = bytes[at++];
        const min = leb();
        const max = (flags & 1) ? leb() : 65536;
        return {min: min, max: max};
    }
    while (at < bytes.length) {
        const id = bytes[at++];
        const size = leb();
        const end = at + size;
        if (id === 2) {
            const count = leb();
            for (let i = 0; i < count; i++) {
                const module = name();
                const field = name();
                const kind = bytes[at++];
                if (kind === 0) { leb(); }
                else if (kind === 1) { at++; limits(); }
                else if (kind === 2) {
                    const found = limits();
                    if (module === "env" && field === "memory") {
                        return found;
                    }
                }
                else if (kind === 3) { at += 2; }
                else if (kind === 4) { at++; leb(); }
            }
        }
        at = end;
    }
    return null;
}

const wasm = await fetch("app.wasm");
if (!wasm.ok) { fail("Couldn't load app.wasm"); }
const wasm_bytes = new Uint8Array(await wasm.arrayBuffer());
const wanted = memory_limits(wasm_bytes);
if (wanted === null) {
    fail("app.wasm doesn't import its memory: build it the way concat " +
        "does (WEB_FLAGS)");
}
memory = new WebAssembly.Memory({
    initial: wanted.min,
    maximum: wanted.max,
    shared: true,
});
wasm_module = await WebAssembly.compile(wasm_bytes);
const instance = await WebAssembly.instantiate(wasm_module, {
    env: {memory: memory},
    t1: t1_imports,
    wasi_snapshot_preview1: wasi_imports,
    wasi: {"thread-spawn": thread_spawn},
});

const start = WebAssembly.promising(instance.exports._start);
let exit_code = 0;
try {
    await start();
} catch (e) {
    if (e instanceof T1Exit) {
        exit_code = e.code;
    } else {
        // a trap: an assert or T1_crash() said why on stderr just before
        for (const fd of [1, 2]) {
            if (pending_text[fd] !== "") { write_text(fd, "\n"); }
        }
        show_on_page("The app crashed: " + e, "#f66");
        if (e.stack) { console.error(e.stack); }
        return;
    }
}
for (const fd of [1, 2]) {
    if (pending_text[fd] !== "") { write_text(fd, "\n"); }
}
if (exit_code !== 0) {
    for (const line of stdout_lines) { show_on_page(line, "#ccc"); }
}
show_on_page("The app ended (exit code " + exit_code + ").",
    exit_code === 0 ? "#999" : "#f66");

})();
</script>
</body>
